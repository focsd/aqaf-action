name: Self test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local:
    # Runs the action from this checkout on hosted runners.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the action on this repository
        id: scan
        uses: ./
        with:
          output: aqaf-action-report.json
      - name: The report exists and the step output points at it
        shell: bash
        env:
          REPORT: ${{ steps.scan.outputs.report }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          report = pathlib.Path(os.environ['REPORT'])
          assert report.is_file(), 'output report missing: ' + str(report)
          data = json.loads(report.read_text())
          assert isinstance(data['findings'], list)
          print('report ok: AQAF', data['aqaf_version'], 'findings', len(data['findings']))
          PY
      - name: The baseline gate passes when nothing is new
        uses: ./
        with:
          output: aqaf-action-report-2.json
          baseline: aqaf-action-report.json
          fail-on: new-high
      - name: An invalid input is rejected
        id: invalid
        continue-on-error: true
        uses: ./
        with:
          gitignore: 'maybe'
      - name: Confirm the invalid input failed the step
        shell: bash
        run: test "${{ steps.invalid.outcome }}" = failure

  published-tag:
    # On a release tag, use the action the way a consumer does: by repository and tag.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use the published tag
        id: consumer
        uses: focsd/aqaf-action@${{ github.ref_name }}
        with:
          output: aqaf-consumer-report.json
      - name: Check the report names the tagged version
        shell: bash
        env:
          REPORT: ${{ steps.consumer.outputs.report }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          data = json.loads(pathlib.Path(os.environ['REPORT']).read_text())
          assert 'v' + data['aqaf_version'] == os.environ['TAG'], (data['aqaf_version'], os.environ['TAG'])
          print('consumer run ok:', os.environ['TAG'])
          PY
